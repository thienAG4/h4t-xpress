[project]
name = "h4t-api"
version = "0.1.0"
description = "H4T Xpress API - last-mile delivery and incident handling"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text in strings/comments is intentional

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ migrations folder would otherwise make the package look first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
